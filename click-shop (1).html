<!doctype html>
<html lang="ar-DZ" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080e1b">
  <meta name="description" content="شوف عروض الاشتراكات الرقمية عند Click Shop واطلب على واتساب.">
  <title>Click Shop | اشتراكات رقمية</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Chivo:wght@800;900&family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');

:root {
  color-scheme: dark;
  font-family: Vazirmatn, Tahoma, Arial, sans-serif;
  --bg: #080e1b;
  --panel: #101a2c;
  --line: #243650;
  --text: #eff5ff;
  --soft: #b6c8e3;
  --accent: #63ecdb;
  --accent-dark: #052924;
  background: var(--bg);
  color: var(--text);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body { margin: 0; }
body:has(dialog[open]) { overflow: hidden; }
button, a { -webkit-tap-highlight-color: transparent; }
button { font: inherit; }
button:not(:disabled) { cursor: pointer; }
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
h1, h2, h3, p { margin: 0; }
.wrap { width: min(100% - 3rem, 75rem); margin-inline: auto; }
.top { border-bottom: 1px solid #1b2940; }
.header-inner { min-height: 4.5rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
.wordmark { display: inline-block; color: var(--text); font: 900 clamp(1.5rem, 3vw, 2.05rem)/1 Chivo, Arial, sans-serif; letter-spacing: -.075em; white-space: nowrap; }
.wordmark span { color: var(--accent); }
nav { display: flex; align-items: center; flex-wrap: wrap; gap: .35rem 1.6rem; }
nav a { color: var(--soft); font-size: .95rem; font-weight: 700; padding-block: .55rem; }
nav a:hover { color: white; }

.hero {
  position: relative;
  isolation: isolate;
  margin-block: clamp(1rem, 3vw, 2.65rem) clamp(2.75rem, 6vw, 5.25rem);
  display: grid;
  grid-template-columns: 1.04fr .96fr;
  min-height: clamp(24rem, 43vw, 34rem);
  overflow: hidden;
  border: 1px solid #284267;
  border-radius: clamp(1.2rem, 2.5vw, 2rem);
  background: linear-gradient(125deg, #032032, #08162f 52%, #0b1428);
}
.hero-copy { grid-column: 1; grid-row: 1; align-self: center; z-index: 1; padding: clamp(2rem, 5.4vw, 5rem); }
.hero h1 { font-size: clamp(2.4rem, 5.1vw, 5.15rem); line-height: 1.15; font-weight: 900; letter-spacing: -.035em; }
.hero h1 em { color: var(--accent); font-style: normal; }
.hero-copy p { max-width: 34ch; color: #c0d2ec; font-size: clamp(1rem, 1.55vw, 1.17rem); line-height: 1.8; margin-block: 1.1rem 1.65rem; }
.hero-actions { display: flex; flex-wrap: wrap; gap: .65rem; }
.primary, .secondary { display: inline-flex; align-items: center; justify-content: center; min-height: 3rem; border-radius: .72rem; padding: .62rem 1.12rem; font-weight: 800; }
.primary { border: 1px solid transparent; background: var(--accent); color: var(--accent-dark); box-shadow: 0 5px 24px #00d9b921; }
.primary:hover { background: #a1ffef; }
.secondary { border: 1px solid #57728c; background: #091832a8; color: var(--text); }
.secondary:hover { border-color: var(--accent); }
.whatsapp { gap: .45rem; }
.whatsapp::before { content: '☎'; color: var(--accent); font-size: 1.1rem; }
.hero-art {
  grid-column: 2;
  grid-row: 1;
  display: grid;
  grid-template: minmax(0, 1fr) / minmax(0, 1fr);
  place-items: center;
  min-width: 0;
  position: relative;
  isolation: isolate;
  background: radial-gradient(ellipse at 46% 50%, #09446b80, transparent 64%);
}
.hero-art img {
  width: min(98%, 33rem);
  height: auto;
  display: block;
  z-index: 1;
  mix-blend-mode: screen;
  -webkit-mask-image: radial-gradient(ellipse at center, #000 35%, #000e 53%, transparent 74%);
  mask-image: radial-gradient(ellipse at center, #000 35%, #000e 53%, transparent 74%);
  animation: logo-drift 12s ease-in-out infinite alternate;
}
.ambient, .orbit { position: absolute; pointer-events: none; }
.ambient {
  width: 76%;
  aspect-ratio: 1.1;
  background: radial-gradient(ellipse at 72% 31%, #38f6dc72 0%, transparent 51%),
              radial-gradient(ellipse at 24% 77%, #075ffe9c, #0f5ae244 35%, transparent 70%);
  border-radius: 43% 57% 65% 35% / 53% 38% 62% 47%;
  filter: blur(clamp(22px, 4vw, 55px));
  opacity: .8;
  animation: liquid-drift 15s ease-in-out infinite alternate;
}
.orbit { width: 85%; height: 62%; border: 1px solid #79efd64f; border-radius: 50%; box-shadow: 0 0 34px #57ffd312; }
.orbit-one { transform: rotate(-26deg); }
.orbit-two { transform: rotate(27deg); border-color: #649cfd40; }
.motion-paused .hero-art img, .motion-paused .ambient { animation-play-state: paused; }
@keyframes logo-drift {
  from { transform: translate3d(-2%, 1%, 0) rotate(-4deg) scale(.98); }
  to { transform: translate3d(3%, -3%, 0) rotate(4deg) scale(1.07); }
}
@keyframes liquid-drift {
  from { transform: translate3d(-9%, -5%, 0) rotate(-20deg) scale(.89); }
  to { transform: translate3d(6%, 3%, 0) rotate(26deg) scale(1.16); }
}
.motion-toggle {
  position: absolute;
  z-index: 2;
  inset: auto auto .75rem .75rem;
  display: grid;
  place-items: center;
  width: 2.75rem;
  height: 2.75rem;
  border: 1px solid #8ba6c382;
  background: #051120cc;
  color: var(--text);
  border-radius: 50%;
}
.motion-toggle span { width: .68rem; height: .76rem; border-inline: 2px solid currentColor; }
.motion-toggle[aria-pressed="true"] span { background: currentColor; border: 0; clip-path: polygon(10% 0%, 100% 50%, 10% 100%); }

.catalog { margin-block-end: clamp(3rem, 8vw, 7rem); }
.section-title { margin-block-end: .95rem; }
h2 { font-size: clamp(1.9rem, 4.3vw, 3.3rem); line-height: 1.2; font-weight: 900; }
.filters { display: flex; flex-wrap: wrap; gap: .5rem; padding-block-end: 1.1rem; border-bottom: 1px solid var(--line); }
.filters button {
  color: #cad9ef;
  background: #0e1829;
  border: 1px solid var(--line);
  border-radius: 2rem;
  min-height: 2.75rem;
  padding: .4rem .9rem;
  font-weight: 700;
  font-size: .92rem;
}
.filters button:hover { border-color: var(--accent); }
.filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-dark); }
.product-group { margin-block-start: 1.65rem; }
.product-group h3 { font-size: 1.28rem; margin-block-end: .65rem; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .85rem; }
.product { min-width: 0; }
.product-open {
  display: block;
  text-align: right;
  width: 100%;
  height: 100%;
  padding: 0;
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: .95rem;
  overflow: hidden;
}
.product-open:hover, .product-open:focus-visible { border-color: #63ecdb9e; }
.product-media { display: grid; position: relative; place-items: center; grid-template: minmax(0, 1fr) / minmax(0, 1fr); aspect-ratio: 16 / 9; overflow: hidden; background: #071020; }
.product-media img { display: block; width: 100%; height: 100%; object-fit: contain; transition: transform 300ms ease; }
.product-open:hover img, .product-open:focus-visible img { transform: scale(1.075); }
.zoom-icon { display: grid; place-items: center; position: absolute; inset: auto auto .5rem .5rem; width: 2rem; height: 2rem; color: #f0f7ff; background: #05101ddb; border: 1px solid #64809f; border-radius: 50%; }
.zoom-icon::before { content: ''; width: .95rem; height: .95rem; background: currentColor; clip-path: polygon(0 0,38% 0,38% 12%,12% 12%,12% 38%,0 38%,0 0,100% 0,100% 38%,88% 38%,88% 12%,62% 12%,62% 0,100% 0,100% 100%,62% 100%,62% 88%,88% 88%,88% 62%,100% 62%,100% 100%,0 100%,0 62%,12% 62%,12% 88%,38% 88%,38% 100%); }
.product-info { display: grid; gap: .1rem; padding: .7rem .85rem .8rem; overflow-wrap: anywhere; }
.product-name { font-weight: 800; font-size: 1.05rem; }
.product-price { font-weight: 800; color: var(--accent); font-size: .95rem; }

dialog { width: min(54rem, 100% - 1.6rem); max-height: min(90dvh, 48rem); margin: auto; padding: 0; border: 1px solid #3b5778; border-radius: 1.35rem; color: var(--text); background: #101a2d; box-shadow: 0 26px 90px #000a; overscroll-behavior: contain; }
dialog::backdrop { background: #010711d9; backdrop-filter: blur(6px); }
dialog[open] { animation: dialog-in 250ms cubic-bezier(.2,.7,.25,1) both; }
@keyframes dialog-in { from { opacity: 0; transform: translateY(12px) scale(.92); } to { opacity: 1; transform: none; } }
.dialog-shell { position: relative; display: grid; grid-template-columns: 1fr 1fr; }
.dialog-close { position: absolute; z-index: 1; inset: .65rem .65rem auto auto; display: grid; place-items: center; width: 2.75rem; height: 2.75rem; color: white; border: 1px solid #6885aa; border-radius: 50%; background: #071225ed; font-size: 1.75rem; line-height: 1; }
.dialog-media { min-width: 0; display: grid; }
.image-zoom { position: relative; padding: 0; width: 100%; height: 100%; min-height: 15rem; overflow: hidden; border: none; background: #040a14; color: var(--text); cursor: zoom-in; }
.image-zoom:not(:disabled) { cursor: zoom-in; }
.image-zoom[aria-pressed="true"]:not(:disabled) { cursor: zoom-out; }
.image-zoom img { display: block; width: 100%; height: 100%; max-height: 26rem; object-fit: contain; transition: transform 320ms ease; }
.image-zoom[aria-pressed="true"] img { transform: scale(1.45); }
.image-zoom[aria-pressed="true"] .zoom-icon::before { clip-path: polygon(0 41%, 100% 41%, 100% 59%, 0 59%); }
.dialog-content { align-self: center; padding: clamp(1rem, 4vw, 2.25rem); }
.dialog-content h2 { font-size: clamp(1.55rem, 3.8vw, 2.55rem); overflow-wrap: anywhere; }
.dialog-content p { color: var(--soft); margin-block: .5rem .9rem; line-height: 1.55; }
.offers { padding: 0; margin: 0; list-style: none; display: grid; gap: .42rem; }
.offers a { display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding: .6rem .65rem; min-height: 2.8rem; border-radius: .7rem; background: #1c2c44; color: #eff6ff; }
.offers a:hover { background: #273b57; }
.offers bdi { text-align: right; }
.offers strong { white-space: nowrap; color: var(--accent); }

footer { border-top: 1px solid var(--line); background: #0b1424; padding-block: 2rem; }
.footer-inner { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
.footer-inner p { color: var(--soft); margin-block-start: .5rem; }
.footer-links { gap: .55rem; }
.footer-links a { min-height: 2.75rem; padding: .43rem .9rem; border: 1px solid #415778; border-radius: 2rem; }
.footer-links a:hover { border-color: var(--accent); }

.stats { padding-block: 3.5rem; }
.stats h1 { font-size: clamp(2rem, 6vw, 4rem); }
.stats h2 { font-size: clamp(1.2rem, 4vw, 2rem); }
.stats-count { color: var(--accent); font-size: clamp(4rem, 15vw, 8rem); font-weight: 900; line-height: 1.1; margin-block: 1rem .5rem; }
.stats h2 + p { color: var(--soft); margin-block-start: .55rem; }
.stats .secondary { margin-block-start: 1.25rem; }
.stats-feedback { color: var(--soft); margin-block-start: .55rem; }

@media (max-width: 850px) {
  .hero-copy { padding: 2rem; }
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 620px) {
  .wrap { width: calc(100% - 1.5rem); }
  .header-inner { min-height: 3.65rem; }
  nav { gap: .65rem; }
  .hero { grid-template-columns: 1fr; grid-template-rows: minmax(0, auto) auto; min-height: 0; }
  .hero-art { grid-column: 1; grid-row: 1; height: clamp(10rem, 52vw, 15rem); overflow: hidden; }
  .hero-art img { width: min(85%, 22rem); max-height: none; }
  .ambient { width: 79%; height: 120%; }
  .orbit { height: 65%; width: 70%; }
  .hero-copy { grid-row: 2; padding: .15rem 1.15rem 1.4rem; }
  .hero h1 { font-size: clamp(2.12rem, 8vw, 3.3rem); }
  .hero-copy p { margin-block: .75rem 1.05rem; }
  .motion-toggle { inset: .55rem auto auto .55rem; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .55rem; }
  .product-info { padding: .6rem; }
  .product-name { font-size: .95rem; }
  .zoom-icon { inset: auto auto .35rem .35rem; }
  .dialog-shell { grid-template-columns: 1fr; }
  .image-zoom { min-height: 0; height: clamp(11rem, 54vw, 18rem); }
  .dialog-content { padding: .95rem 1rem 1.15rem; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition-duration: .001ms !important; }
  .motion-toggle { display: none; }
}
</style>
</head>

const photos = image => embeddedImages[image];
const whatsapp = document.querySelector(".whatsapp").href;
const filters = document.querySelector("#filters");
const groups = document.querySelector("#product-groups");
const cardTemplate = document.querySelector("#product-template");
const dialog = document.querySelector("#product-dialog");
const dialogImage = dialog.querySelector("img");
const zoom = dialog.querySelector(".image-zoom");
const offers = dialog.querySelector(".offers");
let selectedCard = null;

function setZoomed(enabled) {
  zoom.setAttribute("aria-pressed", String(enabled));
  zoom.setAttribute("aria-label", enabled ? "تصغير الصورة" : "تكبير الصورة");
}

function showProduct(product, card) {
  selectedCard = card;
  dialog.querySelector("h2").textContent = product.name;
  dialogImage.src = photos(product.image);
  dialogImage.alt = product.name;
  setZoomed(false);
  offers.replaceChildren();

  for (const [label, price] of product.offers) {
    const item = document.createElement("li");
    const link = document.createElement("a");
    const name = document.createElement("bdi");
    const amount = document.createElement("strong");
    name.textContent = label;
    amount.textContent = `${price} ألف`;
    const message = `سلام Click Shop، حاب نطلب ${product.name} (${label}) بسعر ${price} ألف.`;
    link.href = `${whatsapp}?text=${encodeURIComponent(message)}`;
    link.setAttribute("aria-label", `اطلب ${product.name}، ${label}، ${price} ألف على واتساب`);
    link.append(name, amount);
    item.append(link);
    offers.append(item);
  }
  dialog.showModal();
}

for (const category of categories) {
  const section = document.createElement("section");
  const heading = document.createElement("h3");
  const grid = document.createElement("div");
  section.className = "product-group";
  section.dataset.category = category.id;
  heading.textContent = category.name;
  grid.className = "grid";
  for (const product of products.filter(entry => entry.category === category.id)) {
    const card = cardTemplate.content.cloneNode(true);
    const button = card.querySelector("button");
    const image = new Image();
    image.alt = "";
    image.loading = "lazy";
    image.decoding = "async";
    image.src = photos(product.image);
    card.querySelector(".product-media").prepend(image);
    card.querySelector(".product-name").textContent = product.name;
    const lowest = Math.min(...product.offers.map(([, price]) => price));
    card.querySelector(".product-price").textContent = `${product.offers.length > 1 ? "من " : ""}${lowest} ألف`;
    button.setAttribute("aria-label", `عرض تفاصيل ${product.name}`);
    button.addEventListener("click", () => showProduct(product, button));
    grid.append(card);
  }
  section.append(heading, grid);
  groups.append(section);
}

for (const category of [{ id: "all", name: "الكل" }, ...categories]) {
  const filter = document.createElement("button");
  filter.type = "button";
  filter.textContent = category.name;
  filter.setAttribute("aria-controls", groups.id);
  filter.setAttribute("aria-pressed", String(category.id === "all"));
  filter.addEventListener("click", () => {
    for (const button of filters.children) button.setAttribute("aria-pressed", String(button === filter));
    for (const section of groups.children) section.hidden = category.id !== "all" && category.id !== section.dataset.category;
  });
  filters.append(filter);
}

zoom.addEventListener("click", () => setZoomed(zoom.getAttribute("aria-pressed") === "false"));
dialog.querySelector(".dialog-close").addEventListener("click", () => dialog.close());
dialog.addEventListener("click", event => {
  if (event.target === dialog) dialog.close();
});
dialog.addEventListener("close", () => selectedCard?.focus());

const motion = document.querySelector(".motion-toggle");
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
  motion.hidden = false;
  motion.addEventListener("click", () => {
    const paused = motion.getAttribute("aria-pressed") === "false";
    motion.setAttribute("aria-pressed", String(paused));
    motion.setAttribute("aria-label", paused ? "تشغيل حركة الخلفية" : "إيقاف حركة الخلفية");
    motion.closest(".hero").classList.toggle("motion-paused", paused);
  });
}

</script>
</body>
</html>
